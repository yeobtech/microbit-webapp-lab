<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>전자 부품 관찰실</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f4ef;color:#182c30;font:16px/1.5 system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:28px}h1{font-size:clamp(26px,4vw,48px);margin:0}h2{margin:0}header p{margin:2px 0 22px}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}article,aside{background:white;border:1px solid #d4ddd8;border-radius:18px;overflow:hidden}article{position:sticky;top:12px}.info,aside{padding:18px}.info p{margin:5px 0}#stage{height:clamp(260px,47vh,480px);background:#e7ece8}canvas{display:block;touch-action:none;width:100%;height:100%}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}button,a{font:inherit;color:inherit}button{background:#f5f7f4;border:1px solid #d5ded7;border-radius:10px;cursor:pointer;padding:6px}button[aria-pressed=true]{border:2px solid #247162;background:#e5f3ed}button img{width:100%;display:block;aspect-ratio:1.48;object-fit:cover;border-radius:6px}button span{font-size:14px;font-weight:650}a{color:#196352}small{color:#445e56}aside h3{grid-column:1/-1;margin:6px 0}.bar{display:flex;gap:16px;align-items:center;margin-top:10px}@media(max-width:750px){main{padding:12px}.layout{grid-template-columns:1fr}article{position:static}#stage{height:32vh}}article{position:static}#pins{list-style:none;padding:0;display:grid;gap:5px;margin:10px 0}#pins b{display:inline-block;color:white;background:#68459a;border-radius:5px;min-width:48px;text-align:center}#pins [data-role=v]{background:#b93434}#pins [data-role=g]{background:#263446}#pins [data-role=s]{background:#176945}#pins [data-role=n]{background:#687384}#gpioMap{overflow-x:auto;margin:14px 0}#gpioMap table{border-collapse:collapse;width:100%;font-size:14px}#gpioMap td,#gpioMap th{padding:8px;border:1px solid #ced8d2;text-align:left}.bar{flex-wrap:wrap}</style>
<main><header><h1>전자 부품 관찰실</h1><p>부품을 고르고 돌려 보세요. 외형을 익히기 위한 대표 모델로, 제품에 따라 크기와 단자 배치가 달라요.</p></header><div class="layout"><article><div id="stage"></div><div class="info"><small id="type"></small><h2 id="title"></h2><p id="desc"></p><ul id="pins" aria-label="단자별 역할"></ul><p id="pinNote"></p><div id="gpioMap" hidden></div><p><small>색은 도감에서 역할을 구분하는 표시예요. 실제 연결은 제품의 핀 표기와 정격 전압을 확인하세요.</small></p><small>드래그로 회전 · 휠 또는 두 손가락으로 확대</small><div class="bar"><button id="reset">처음 각도</button><button id="topView" hidden>핀 번호 위에서 보기</button><a id="download" download>3D 파일 받기 (.glb)</a></div></div></article><aside><div id="grid"></div></aside></div></main><script src="viewer.bundle.js"></script></html>
